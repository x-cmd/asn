id: x-1-overview-01-about

data:
  - name:
      en: "Addresses, autonomous systems, and the five registries that hand them out"
      cn: "地址、自治系统，以及发放它们的那五个机构"
    qa:
      - id: address-vs-asn
        question:
          en: "What is the difference between an IP address and an ASN?"
          cn: "IP 地址和 ASN 有什么区别？"
        answer:
          en: >
            An address says where to deliver a packet; an ASN says which network announces the route to it. Routers do not carry addresses in their tables — they carry "to AS13335, via this neighbour". Every IP prefix belongs to exactly one ASN. The practical consequence: address space can be bought, transferred and resold, while an ASN cannot, because it is an identifier rather than a resource.
          cn: >
            地址说明包该送到哪里；ASN 说明是哪个网络在广播通往那里的路由。路由器的表里装的不是地址，而是"到 AS13335，经由这个邻居"。每一个 IP 前缀都恰好属于一个 ASN。实际后果是：地址空间可以买卖、转让、转售，而 ASN 不行 —— 因为它是标识符而不是资源。
        confidence: 10
        reference:
          - docs/1-overview/01-about/en.md
          - docs/1-overview/01-about/cn.md
